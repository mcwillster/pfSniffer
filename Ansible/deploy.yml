---
- name: Windows Firefox Setup
  hosts: windows
  gather_facts: no
  tasks:

    - name: Create distribution directory
      ansible.windows.win_file:
        path: C:\Program Files\Mozilla Firefox\distribution
        state: directory

    - name: Download policies.json
      ansible.windows.win_get_url:
        url: https://raw.githubusercontent.com/mcwillster/pfSniffer/refs/heads/IRSeC/Client/Firefox/Windows/policies.json
        dest: C:\Program Files\Mozilla Firefox\distribution\policies.json
        force: true

    - name: Download cert.pem
      ansible.windows.win_get_url:
        url: https://raw.githubusercontent.com/mcwillster/pfSniffer/refs/heads/IRSeC/Server/cert.pem
        dest: C:\Program Files\Mozilla Firefox\distribution\cert.pem
        force: true

    - name: Add cert to Windows library
      ansible.windows.win_powershell:
        script: Import-Certificate -FilePath "C:\Program Files\Mozilla Firefox\distribution\cert.pem" -CertStoreLocation Cert:\LocalMachine\Root

- name: Windows Edge Setup
  hosts: skip-for-now #disabled because not working due to not on edge addon store
  gather_facts: no
  tasks:
    
    - name: Force install custom Edge extension
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist
        name: "1"
        data: "jdmninjjbnicomamhgcnomgimkbbmkch;https://raw.githubusercontent.com/mcwillster/pfSniffer/refs/heads/IRSeC/Client/Chrome/update.xml"
        type: string
        state: present

- name: Brute-Force Delete Microsoft Edge
  hosts: windows
  gather_facts: no
  tasks:
    - name: Forcefully kill all Edge and WebView2 background processes
      ansible.windows.win_shell: |
        Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
        Stop-Process -Name msedgewebview2 -Force -ErrorAction SilentlyContinue
        Stop-Process -Name widgetservice -Force -ErrorAction SilentlyContinue
      ignore_errors: yes

    - name: Delete the Microsoft Edge application folder
      ansible.windows.win_file:
        path: "C:\\Program Files (x86)\\Microsoft\\Edge"
        state: absent

    - name: Remove Edge Start Menu shortcut
      ansible.windows.win_file:
        path: "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Microsoft Edge.lnk"
        state: absent
    
    - name: Remove Edge Taskbar shortcut
      ansible.windows.win_file:
        path: "C:\\Users\\admin\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\User Pinned\\Taskbar\\Microsoft Edge.lnk"
        state: absent
        
    - name: Remove Edge Desktop shortcut
      ansible.windows.win_file:
        path: "C:\\Users\\admin\\Desktop\\Microsoft Edge.lnk"
        state: absent

- name: Windows Chrome Setup
  hosts: windows
  gather_facts: no
  tasks:
    
    - name: Ensure the Chrome ExtensionInstallForcelist registry path exists
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist
        name: "1"
        data: "jdmninjjbnicomamhgcnomgimkbbmkch;https://clients2.google.com/service/update2/crx"
        type: string
        state: present
    
    - name: Set IncognitoModeAvailability to Disabled
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome
        name: IncognitoModeAvailability
        data: 1 # 1 = Disabled, 0 = Available, 2 = Forced
        type: dword
        state: present

    - name: Update Group Policy to apply registry changes immediately
      ansible.windows.win_command: gpupdate /force
      register: gpupdate_result
      changed_when: false
  
- name: Deploy Custom pfSense Auth.inc File
  hosts: pfsense
  gather_facts: no
  tasks:

    - name: Download custom auth.inc from GitHub
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/mcwillster/pfSniffer/refs/heads/IRSeC/pfSense/auth.inc"
        dest: /etc/inc/auth.inc
        mode: '0644'
        backup: yes

    - name: Restart the webConfigurator
      ansible.builtin.command: /etc/rc.restart_webgui

- name: OH SHIT I BROKE ANSIBLE WEB GUI 
  hosts: skip-for-now
  gather_facts: no
  tasks:

    - name: Reinstall pfsense package
      ansible.builtin.command: pkg-static install -y -f pfsense

- name: Alt Ansible Deploy
  hosts: skip-for-now
  gather_facts: no
  tasks:

    - name: Disable HttpOnly for session cookies safely
      ansible.builtin.replace:
        path: /etc/inc/auth.inc
        regexp: "'httponly' => true"
        replace: "'httponly' => false"
        backup: yes

- name: Linux Firefox Setup
  hosts: linux
  tags: run_this_play_only
  gather_facts: no
  tasks:

    - name: Create firefox/policies directory
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        mode: '0755'
        owner: root
        group: root
      become: true

    - name: Download policies.json
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mcwillster/pfSniffer/refs/heads/IRSeC/Client/Firefox/Linux/policies.json
        dest: /etc/firefox/policies/policies.json
        mode: '0755'
        owner: root
        group: root
      become: true

    - name: Download cert.pem
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mcwillster/pfSniffer/refs/heads/IRSeC/Server/cert.pem
        dest: /etc/firefox/policies/cert.pem
        mode: '0755'
        owner: root
        group: root
      become: true
