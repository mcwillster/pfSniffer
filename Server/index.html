<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Session Monitor</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: #e0e0e0; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background-color: #1e1e1e; color: #4caf50; }
        .highlight { animation: flash 1s ease-out; }
        @keyframes flash { 0% { background-color: #2e7d32; } 100% { background-color: transparent; } }
        
        /* New styling for the copy button */
        .copy-btn {
            background-color: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 3px 8px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }
        .copy-btn:hover { background-color: #555; }
        .copy-btn.copied {
            background-color: #4caf50;
            color: white;
            border-color: #4caf50;
        }
    </style>
</head>
<body>

    <h2>Live Session Monitor</h2>
    <p>Last updated: <span id="last-updated">Waiting...</span></p>

    <table>
        <thead>
            <tr>
                <th>Team</th>
                <th>pfSense IP</th>
                <th>Client IP</th>
                <th>Session ID</th>
                <th>Browser</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="monitor-body">
            <!-- Data will be injected here -->
        </tbody>
    </table>

    <script>
        let previousTimestamps = {};

        // New function to handle clipboard copying and button visual feedback
        function copySession(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "Copied!";
                btnElement.classList.add("copied");
                
                // Reset the button after 1.5 seconds
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove("copied");
                }, 1500);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
                btnElement.innerText = "Error";
            });
        }

        async function fetchLatestData() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();
                
                const tbody = document.getElementById('monitor-body');
                tbody.innerHTML = ''; 

                data.forEach(entry => {
                    const tr = document.createElement('tr');
                    
                    if (entry.status === "No data") {
                        tr.innerHTML = `<td>${entry.team}</td><td colspan="5" style="color: #888;">Awaiting first session...</td>`;
                    } else {
                        let isNew = false;
                        if (previousTimestamps[entry.team] !== entry.timestamp) {
                            isNew = true;
                            previousTimestamps[entry.team] = entry.timestamp;
                        }

                        if (isNew) tr.classList.add('highlight');

                        // The session_id column now includes the copy button
                        tr.innerHTML = `
                            <td><strong>${entry.team}</strong></td>
                            <td>${entry.pfsense_ip}</td>
                            <td>${entry.client_ip}</td>
                            <td style="word-break: break-all; display: flex; justify-content: space-between; align-items: center;">
                                <span>${entry.session_id}</span>
                                <button class="copy-btn" onclick="copySession('${entry.session_id}', this)">Copy</button>
                            </td>
                            <td>${entry.browser}</td>
                            <td>${entry.timestamp}</td>
                        `;
                    }
                    tbody.appendChild(tr);
                });

                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('last-updated').textContent = "Connection Error";
            }
        }

        fetchLatestData();
        setInterval(fetchLatestData, 2000);
    </script>
</body>
</html>
