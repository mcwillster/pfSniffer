<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pfSniffer</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: #e0e0e0; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background-color: #1e1e1e; color: #2196f3; } 
        
        .highlight { animation: flash 1s ease-out; }
        @keyframes flash { 0% { background-color: #2e7d32; } 100% { background-color: transparent; } }
        
        .status-recent { background-color: rgba(76, 175, 80, 0.15); } 
        .status-idle { background-color: rgba(255, 152, 0, 0.15); }   
        .status-stale { background-color: rgba(244, 67, 54, 0.15); color: #999; } 
        .status-logged-out { background-color: rgba(255, 152, 0, 0.05); color: #ff9800; }

        /* --- NEW STYLES FOR HEADER AND DOWNLOAD BUTTON --- */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .download-btn {
            background-color: #2196f3;
            color: #ffffff;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #1976d2;
        }

        .copy-btn {
            background-color: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 3px 8px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }
        .copy-btn:hover { background-color: #555; }
        .copy-btn.copied {
            background-color: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        .time-ago {
            cursor: help;
            border-bottom: 1px dotted #888;
        }
    </style>
</head>
<body>

    <!-- --- UPDATED HEADER SECTION --- -->
    <div class="header-container">
        <div>
            <h2>Live Session Monitor</h2>
            <p>Last updated: <span id="last-updated">Waiting...</span></p>
        </div>
        <a href="/api/download_db" class="download-btn">Download DB</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Team</th>
                <th>pfSense IP</th>
                <th>Client IP</th>
                <th>Session ID</th>
                <th>Browser</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody id="monitor-body">
            <!-- Data will be injected here -->
        </tbody>
    </table>

    <script>
        let previousTimestamps = {};

        function showCopied(btnElement) {
            btnElement.innerText = "Copied!";
            btnElement.classList.add("copied");
            setTimeout(() => {
                btnElement.innerText = "Copy";
                btnElement.classList.remove("copied");
            }, 1500);
        }

        function copySession(text, btnElement) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showCopied(btnElement))
                    .catch(err => {
                        console.error("Failed to copy text: ", err);
                        btnElement.innerText = "Error";
                    });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; 
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopied(btnElement);
                } catch (err) {
                    console.error("Fallback copy failed: ", err);
                    btnElement.innerText = "Error";
                }
                document.body.removeChild(textArea);
            }
        }

        function getElapsedSeconds(timestampStr) {
            const entryTime = new Date(timestampStr + "Z").getTime();
            const now = Date.now();
            return Math.floor((now - entryTime) / 1000);
        }

        function getRowClass(timestampStr) {
            const elapsedSeconds = getElapsedSeconds(timestampStr);
            if (elapsedSeconds < 600) return "status-recent"; 
            if (elapsedSeconds < 1800) return "status-idle";   
            return "status-stale";  
        }

        function timeSince(timestampStr) {
            const seconds = Math.max(0, getElapsedSeconds(timestampStr)); 
            
            if (seconds < 60) return seconds + "s ago";
            
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + "m ago";
            
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + "h ago";
            
            const days = Math.floor(hours / 24);
            return days + "d ago";
        }

        async function fetchLatestData() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();
                
                const tbody = document.getElementById('monitor-body');
                tbody.innerHTML = ''; 

                data.forEach(entry => {
                    const tr = document.createElement('tr');
                    
                    if (entry.status === "No data") {
                        tr.innerHTML = `<td>${entry.team}</td><td colspan="5" style="color: #888;">Awaiting first session...</td>`;
                    } else {
                        const ageClass = getRowClass(entry.timestamp);
                        tr.classList.add(ageClass);

                        if (!entry.logged_in) {
                            tr.classList.add('status-logged-out');
                        }

                        if (previousTimestamps[entry.team] !== entry.timestamp) {
                            tr.classList.add('highlight');
                            previousTimestamps[entry.team] = entry.timestamp;
                        }

                        const browserContent = entry.logged_in 
                            ? entry.browser 
                            : '<span style="font-style: italic; opacity: 0.8;">Not logged in</span>';

                        tr.innerHTML = `
                            <td><strong>${entry.team}</strong></td>
                            <td><a href="http://${entry.pfsense_ip}" target="_blank" style="color: #2196f3; text-decoration: none; border-bottom: 1px dashed #2196f3;">${entry.pfsense_ip}</a></td>
                            <td>${entry.client_ip}</td>
                            <td style="word-break: break-all; display: flex; justify-content: space-between; align-items: center;">
                                <span>${entry.session_id}</span>
                                <button class="copy-btn" onclick="copySession('${entry.session_id}', this)">Copy</button>
                            </td>
                            <td>${browserContent}</td>
                            <td><span class="time-ago" title="${entry.timestamp} UTC">${timeSince(entry.timestamp)}</span></td>
                        `;
                    }
                    tbody.appendChild(tr);
                });

                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('last-updated').textContent = "Connection Error";
            }
        }

        fetchLatestData();
        setInterval(fetchLatestData, 2000);
    </script>
</body>
</html>
